name: Vybe Fixed Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Fixed 3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: false

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build APK without Auto-Upgrade
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload Vybe APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vybe-Direct-App
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
