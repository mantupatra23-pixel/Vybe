name: Build and Release Vybe APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Move APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/Vybe-APK.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Vybe-APK
          path: build/app/outputs/flutter-apk/Vybe-APK.apk
